name: Build-n-Deploy

# Personal test harness between machines.
# Builds LaTIM-SNAP from source inside the latimsnap docker base image,
# bundles a standalone Linux build with linuxdeployqt (Qt + ITK + VTK libs),
# tars it as LaTIM-SNAP-current.tar.gz, and rclone-copies it to pcloud:~/TEMP.
#
# NOTE: compilation is only possible inside the docker base image
# (ghcr.io/vhxjaouen/latimsnap-base) - the raw GitHub runner has no toolchain.

on:
  workflow_dispatch:

env:
  BUILD_DIR: build
  # Override these repo variables/secret if your base image installs ITK/VTK
  # somewhere else. Leave unset to let CMake locate Qt/ITK/VTK on its own.
  ITK_DIR: ${{ vars.ITK_DIR }}
  VTK_DIR: ${{ vars.VTK_DIR }}

jobs:
  build-deploy:
    name: Docker build + deploy
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Build LaTIM-SNAP inside docker base image
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspaces/latimsnap \
            -w /workspaces/latimsnap \
            -e QT_X11_NO_MITSHM=1 \
            -e QT_QPA_PLATFORM=offscreen \
            ghcr.io/vhxjaouen/latimsnap-base:latest \
            bash -c "
              set -e
              export BUILD_DIR='$BUILD_DIR'
              CMAKE_ARGS='-S . -B \$BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release'
              if [ -n '$ITK_DIR' ]; then CMAKE_ARGS+=\" -DITK_DIR=$ITK_DIR\"; fi
              if [ -n '$VTK_DIR' ]; then CMAKE_ARGS+=\" -DVTK_DIR=$VTK_DIR\"; fi
              echo \">> cmake \$CMAKE_ARGS\"
              cmake \$CMAKE_ARGS
              cmake --build \$BUILD_DIR --config Release --target LaTIM-SNAP
            "

      - name: Package self-contained bundle (linuxdeployqt) as tar.gz
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspaces/latimsnap \
            -w /workspaces/latimsnap \
            ghcr.io/vhxjaouen/latimsnap-base:latest \
            bash -c "
              set -e
              cd /workspaces/latimsnap
              # 1. Install to a bundle directory (honours DESTDIR prefix)
              rm -rf build/bundle
              DESTDIR=/workspaces/latimsnap/build/bundle cmake --install build

              # Bundle the vendored python I2I server (GPL, ships with the app)
              bundle_py=build/bundle/usr/local/lib/snap-4.4.0/share/latimsnap-i2i
              mkdir -p "$bundle_py"
              cp -r Python/latimsnap_i2i/. "$bundle_py/"
              # Bundle the CBCT denoising model package (self-contained)
              cp -r Submodules/cbctdenoise \
                 build/bundle/usr/local/lib/snap-4.4.0/share/cbctdenoise

              # 2. Download + extract linuxdeployqt once (cached, gitignored)
              if [ ! -f linuxdeployqt ]; then
                wget -c -nv \
                  https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage \
                  -O linuxdeployqt && chmod a+x linuxdeployqt
              fi
              if [ ! -d squashfs-root ]; then ./linuxdeployqt --appimage-extract; fi

              # 3. Bundle Qt + ITK + VTK shared libs and plugins, patch RPATH to \$ORIGIN
              ./squashfs-root/AppRun \
                build/bundle/usr/local/lib/snap-4.4.0/LaTIM-SNAP \
                -qmake=/usr/bin/qmake6 \
                -bundle-non-qt-libs \
                -unsupported-allow-new-glibc

              # 4. Tar the whole bundle (binary + libs + plugins)
              cd build/bundle/usr/local/lib
              tar -czf /workspaces/latimsnap/LaTIM-SNAP-current.tar.gz snap-4.4.0
              ls -la /workspaces/latimsnap/LaTIM-SNAP-current.tar.gz
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaTIM-SNAP-current
          path: ${{ github.workspace }}/LaTIM-SNAP-current.tar.gz

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Write rclone config (from secret)
        if: ${{ secrets.RCLONE_CONFIG != '' }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Copy to pcloud
        if: ${{ secrets.RCLONE_CONFIG != '' }}
        working-directory: ${{ github.workspace }}
        run: |
          rclone copy LaTIM-SNAP-current.tar.gz pcloud:~/TEMP
